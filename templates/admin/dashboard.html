<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能垃圾分類 Bot - 管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #343a40; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover { color: #fff; }
        .sidebar .nav-link.active { color: #fff; background-color: #495057; }
        .main-content { padding: 20px; }
        .stat-card { border-left: 4px solid #007bff; }
        .stat-card.success { border-left-color: #28a745; }
        .stat-card.warning { border-left-color: #ffc107; }
        .stat-card.danger { border-left-color: #dc3545; }
        /* vvv 新增樣式 vvv */
        .sidebar .nav-link .badge { float: right; margin-top: 4px; }
        /* ^^^ 新增樣式 ^^^ */
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">🌱 管理後台</h4>
                    </div>
                    
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('dashboard') %}active{% endif %}" href="{{ url_for('dashboard') }}">
                                <i class="fas fa-tachometer-alt me-2"></i>
                                儀表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('users') %}active{% endif %}" href="{{ url_for('users') }}">
                                <i class="fas fa-users me-2"></i>
                                使用者管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('classifications') %}active{% endif %}" href="{{ url_for('classifications') }}">
                                <i class="fas fa-images me-2"></i>
                                分類記錄
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('waste_info') %}active{% endif %}" href="{{ url_for('waste_info') }}">
                                <i class="fas fa-recycle me-2"></i>
                                垃圾資訊
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('unresolved_items') %}active{% endif %}" href="{{ url_for('unresolved_items') }}">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                規則缺口
                                {% if stats and stats.unresolved_count > 0 %}
                                    <span class="badge bg-danger">{{ stats.unresolved_count }}</span>
                                {% endif %}
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('news') %}active{% endif %}" href="{{ url_for('news') }}">
                                <i class="fas fa-newspaper me-2"></i>
                                新聞管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('scheduler_management') %}active{% endif %}" href="{{ url_for('scheduler_management') }}">
                                <i class="fas fa-clock me-2"></i>
                                排程管理
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <a class="nav-link" href="{{ url_for('logout') }}">
                                <i class="fas fa-sign-out-alt me-2"></i>
                                登出
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                </main>
        </div>
    </div>
    </body>
</html>
